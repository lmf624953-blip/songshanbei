ALGORITHM=h3-long-attention
SOURCE_ROOT="${ROOT}/work/source"
CASE_DIR="${ROOT}"
ENV_SCRIPT="${ROOT}/adapters/env/h3.sh"
BUILD_SCRIPT="${ROOT}/adapters/build/h3-long-attention.sh"
RUN_SCRIPT="${ROOT}/adapters/run/h3-long-attention.sh"
CORRECT_SCRIPT="${ROOT}/adapters/h3-attention-results.py"
METRIC_PARSER="${ROOT}/adapters/h3-attention-results.py"
ARTIFACT_TYPE=shared_lib
ARTIFACTS=("attention/dense-attention-aot.so" "attention/dense-attention-aot.hsaco" "attention/dense-attention-aot-build.json")
PACKAGE_ARGS=()
KERNELS=(dense_attention_aot_kernel)
SNAPSHOT_FILES=(
  flags.conf
  optimization/adaln/aot_codegen.py
  optimization/adaln/build-attention-aot.py
  optimization/adaln/attention_layout.py
  optimization/adaln/accurate_attention.py
  optimization/adaln/precise_attention.py
  optimization/adaln/attention_aot_host.cc
)
E2E_METRIC="A+B kernel median sum (ms)"
export AUTOTUNE_MEASUREMENT_SCOPE="单算子回放"
SUMMARY_METRIC_REGEX='H3_KERNEL_MEDIAN_SUM_MS=[0-9.]+'
SUMMARY_METRIC_SED='s/.*=//'
PMC_SAMPLE_REGEX='^[0-9]+,dense_attention_aot_kernel,'
BASELINE_SELF_CHECK=1
FOCUSED_PMC=0
BENCHMARK_STEPS=11
PMC_STEPS=2
TRACE_ARGS=(--hip-trace --group-stream)
